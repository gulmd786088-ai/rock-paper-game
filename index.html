<!DOCTYPE html>

    <title>Game</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="container">
        <div class="image-box">

        <div class="count-box">
            <div>
                <h1 class="choise"></h1>

            </div>
            <div>
                <h1 class="choise"></h1>

                <h1>COMP</h1>
            </div>

        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
